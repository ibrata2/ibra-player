name: Build iBRA PLAYER
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android car / phone APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: apps/android
        run: |
          set +e
          gradle assembleRelease --no-daemon > build.log 2>&1
          code=$?
          tail -40 build.log
          if [ $code -ne 0 ]; then
            grep -E "error:|e: |FAILURE|What went wrong|Could not|> " build.log | head -40 | sed 's/^/::error::/'
            exit 1
          fi
          ver=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/iBRA PLAYER Android ${ver}.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ibra-player-android
          path: apps/android/out/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows (iBRA PLAYER Setup + portable)
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-mesa
            mingw-w64-ucrt-x86_64-python
            zip

      - name: Read version
        id: ver
        run: |
          v=$(grep -oP 'project\(IBRA_PLAYER VERSION \K[0-9.]+' apps/windows/CMakeLists.txt)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "iBRA PLAYER $v"

      - name: Configure
        run: |
          if ! cmake -S apps/windows -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release > configure.log 2>&1; then
            cat configure.log
            grep -iE -A3 "error|not found|could not|missing|non-existent" configure.log | head -40 | tr -s '\r' | sed 's/^/::error::/'
            exit 1
          fi

      - name: Build
        run: |
          if ! cmake --build build/windows > build.log 2>&1; then
            cat build.log
            grep -iE "error" build.log | head -20 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Assemble application folder
        run: bash apps/windows/packaging/deploy.sh build/windows build/stage

      - name: Self-test with real media (software OpenGL, null audio)
        env:
          IBRA_TEST_AO: "null"
          GALLIUM_DRIVER: llvmpipe
        run: |
          # The test copy gets Mesa's software OpenGL because CI machines have no GPU.
          # Mesa is NOT shipped in the installer.
          set +e +o pipefail
          cp -r build/stage build/test
          for f in $(pacman -Ql mingw-w64-ucrt-x86_64-mesa | awk '{print $2}' | grep -iE '/bin/.*\.dll$'); do cp "$f" build/test/; done
          for f in build/test/opengl32.dll build/test/libgallium_wgl.dll; do
            if [ -f "$f" ]; then
              for d in $(ntldd -R "$f" 2>/dev/null | awk '{print $3}' | tr '\\' '/' | grep -i /ucrt64/bin/); do
                cp -n "$(cygpath -u "$d")" build/test/ 2>/dev/null
              done
            fi
          done
          echo "test folder: $(ls build/test | wc -l) files"
          set +e
          timeout 900 bash apps/windows/packaging/selftest.sh "$(pwd)/build/test/iBRA PLAYER.exe" "$(pwd)/build/selftest" > selftest.log 2>&1
          code=$?
          if [ ! -f build/selftest/report/report.json ]; then
            echo "::error::selftest exit=$code, no report"
            tail -25 selftest.log | sed 's/^/::error::LOG /'
            log="$APPDATA/iBRA PLAYER/logs/ibra-player.log"
            [ -f "$(cygpath -u "$log")" ] && tail -25 "$(cygpath -u "$log")" | sed 's/^/::error::APP /'
            ls build/test | head -80 | tr '\n' ' ' | sed 's/^/::error::FILES /'; echo
            exit 1
          fi
          python apps/windows/packaging/check_report.py build/selftest/report/report.json build/selftest/summary.md || { grep -E "FAILED|\| no" build/selftest/summary.md | head -20 | sed 's/^/::error::/'; exit 1; }
          cat build/selftest/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Normal start-up check (splash + main window)
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          set +e +o pipefail
          log="$(cygpath -u "$APPDATA")/iBRA PLAYER/logs/ibra-player.log"
          before=$(wc -l < "$log" 2>/dev/null || echo 0)
          timeout 12 "build/test/iBRA PLAYER.exe"
          code=$?
          newlines=$(tail -n +$((before + 1)) "$log")
          echo "$newlines"
          if [ $code -ne 124 ]; then echo "::error::player exited by itself (code $code) instead of staying open"; echo "$newlines" | sed 's/^/::error::APP /'; exit 1; fi
          if ! echo "$newlines" | grep -q "main window shown.*video surface ready"; then echo "::error::main window/video surface not ready"; echo "$newlines" | sed 's/^/::error::APP /'; exit 1; fi
          echo "Player started normally and stayed open."

      - name: Portable build
        run: |
          rm -rf "build/iBRA PLAYER Portable"
          cp -r build/stage "build/iBRA PLAYER Portable"
          printf '; iBRA PLAYER portable mode: settings are stored in the data folder\n' > "build/iBRA PLAYER Portable/portable.ini"
          mkdir -p build/installer
          (cd build && zip -qr9 "installer/iBRA PLAYER Portable ${{ steps.ver.outputs.version }}.zip" "iBRA PLAYER Portable")

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build iBRA PLAYER Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $stage = (Resolve-Path 'build\stage').Path
          $out = (Resolve-Path 'build\installer').Path
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DStageDir=$stage" "/DOutDir=$out" 'apps\windows\packaging\installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          Get-ChildItem build\installer

      - uses: actions/upload-artifact@v4
        with:
          name: ibra-player-windows
          path: build/installer/*
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iBRA-PLAYER-selftest-report
          path: |
            build/selftest/report/*
            build/selftest/summary.md
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [android, windows]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ibra-player-*
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: iBRA PLAYER ${{ needs.windows.outputs.version }}
          make_latest: true
          overwrite_files: true
          body: |
            ## iBRA PLAYER ${{ needs.windows.outputs.version }}
            برمجة و تطوير ابراهيم الخزرجي — https://t.me/ibraprogram

            ### ويندوز / Windows 10-11 (64-bit)
            - `iBRA PLAYER Setup ${{ needs.windows.outputs.version }}.exe` — التنصيب (لا يحتاج صلاحيات المسؤول)
            - `iBRA PLAYER Portable ${{ needs.windows.outputs.version }}.zip` — نسخة محمولة

            ### أندرويد — شاشة السيارة / الموبايل / التابلت
            - `iBRA PLAYER Android ${{ needs.windows.outputs.version }}.apk` — Android 6.0+، كل القياسات (1024×600، 1280×720، 1920×720، عمودي)، لمس + أزرار الدركسون

            Every Windows build is played through an automated real-media test (H.264, HEVC, AV1, VP9, MPEG, WMV, 4K HDR, MP3, FLAC, DTS, TrueHD, Arabic subtitles…) and a normal start-up check before it is published.
          files: dist/*
