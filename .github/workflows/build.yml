name: Build iBRA PLAYER
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: apps/android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ibra-player-android-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows setup installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: cmake -S apps/windows -B build/windows -A x64
      - name: Build
        run: cmake --build build/windows --config Release
      - name: Assemble application and Qt runtime
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'build\windows\portable'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $exe = Get-ChildItem 'build\windows' -Recurse -Filter 'iBRA PLAYER.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Windows executable not found.' }
          Copy-Item $exe.FullName $stage
          & windeployqt --release --no-translations (Join-Path $stage 'iBRA PLAYER.exe')
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed.' }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Setup.exe
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler was not installed.' }
          & $compiler 'apps/windows/installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: ibra-player-windows-setup
          path: build/windows/installer/iBRA-PLAYER-Setup-0.1.0.exe
          if-no-files-found: error
          retention-days: 14
